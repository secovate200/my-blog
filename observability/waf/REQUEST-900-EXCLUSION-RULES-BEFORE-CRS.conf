# Blog posts intentionally contain source-code samples. Restrict this exclusion to
# authenticated dashboard write endpoints and only the two content fields; titles,
# tags, authentication endpoints, and every other request remain fully inspected.
SecRule REQUEST_FILENAME "@rx ^/blog/dashboard/posts(?:/[0-9]+)?/$" \
    "id:1000001,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:PUT|DELETE)$" \
        "ctl:ruleRemoveById=911100"

SecRule REQUEST_FILENAME "@rx ^/blog/dashboard/posts(?:/[0-9]+)?/$" \
    "id:1000002,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
        "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.content,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.contentMarkdown"
