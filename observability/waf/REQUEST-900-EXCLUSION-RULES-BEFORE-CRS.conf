# 글 본문에는 코드, HTML, SQL 예제가 포함될 수 있어 일반 공격 문자열과 겹칠 수 있습니다.
# WAF 전체를 끄지 않고 인증과 권한 검사를 수행하는 쓰기 API의 본문 필드만 검사 대상에서
# 제외합니다. 제목, 태그, 로그인, 공개 문의 입력 등 나머지 값은 계속 모든 CRS 규칙으로 검사합니다.

# 로컬 개발 주소는 숫자 IP를 Host로 사용할 수밖에 없어 CRS가 모든 화면·정적 파일 요청을
# 비정상 Host로 오인합니다. 실제 배포 도메인 검사는 유지하고 localhost와 127.0.0.1만 제외합니다.
SecRule REQUEST_HEADERS:Host "@rx ^(?:localhost|127\.0\.0\.1)(?::[0-9]+)?$" \
    "id:1000000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920350"

# 대시보드의 일반 글 수정·삭제 요청은 REST 메서드를 사용하므로 메서드 정책 규칙만 해제합니다.
# 해당 URL은 Django의 로그인 및 게시글 관리 권한 검사를 통과해야 실제 데이터가 변경됩니다.
SecRule REQUEST_FILENAME "@rx ^/blog/dashboard/posts(?:/[0-9]+)?/$" \
    "id:1000001,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:PUT|DELETE)$" \
        "ctl:ruleRemoveById=911100"

# 대시보드 일반 글의 본문만 CRS 검사에서 제외합니다. 코드 예제를 자유롭게 작성하게 하되,
# 제목과 공개 범위 같은 제어 필드는 계속 검사해 예외 범위가 넓어지지 않게 합니다.
SecRule REQUEST_FILENAME "@rx ^/blog/dashboard/posts(?:/[0-9]+)?/$" \
    "id:1000002,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
        "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.content,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.contentMarkdown"

# 연구 글 수정 API의 PUT 메서드가 일반 메서드 정책에 막히지 않게 합니다.
# 생성은 POST이므로 별도 메서드 예외가 필요하지 않습니다.
SecRule REQUEST_FILENAME "@rx ^/blog/dashboard/(?:projects/[0-9]+/posts/|research-posts/[0-9]+/)$" \
    "id:1000003,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "ctl:ruleRemoveById=911100"

# 연구 글도 소스 코드가 본문에 들어가므로 일반 글과 같은 두 본문 필드만 제외합니다.
# 프로젝트 ID, 제목, 공개 여부 등 권한과 노출에 영향을 주는 값은 계속 검사합니다.
SecRule REQUEST_FILENAME "@rx ^/blog/dashboard/(?:projects/[0-9]+/posts/|research-posts/[0-9]+/)$" \
    "id:1000004,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
        "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.content,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.contentMarkdown"

# Django 관리자에서 작성하는 일반 글과 연구 글도 동일한 편집기를 사용합니다.
# 추가·수정 화면의 content 필드만 제외하며 관리자 인증 및 모델별 권한 검사는 그대로 적용됩니다.
SecRule REQUEST_FILENAME "@rx ^/admin/blog/(?:post|projectpost)/(?:add/|[0-9]+/change/)$" \
    "id:1000005,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:content"

# 관리자 문의 답변에는 구분선, SQL, 명령어 예시가 포함될 수 있습니다. 실제 로그에서 `---`가
# SQL/RCE로 오탐된 사례가 있어 답변 필드만 제외하고, 상태를 비롯한 다른 값은 계속 검사합니다.
SecRule REQUEST_FILENAME "@rx ^/admin/blog/contactmessage/[0-9]+/change/$" \
    "id:1000006,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:reply"
