services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4
    restart: unless-stopped
    ports:
      # 로그 관리 UI는 기본적으로 이 PC에서만 접근할 수 있다.
      - "${OPENOBSERVE_BIND_ADDRESS:-127.0.0.1}:5080:5080"
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-change-this-password}
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OPENOBSERVE_RETENTION_DAYS:-14}
    volumes:
      - openobserve-data:/data

  blog-front:
    build:
      context: ./blog-front
      args:
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-https://dashboard.example.com}
    restart: unless-stopped
    ports:
      - "${BLOG_BIND_ADDRESS:-0.0.0.0}:${BLOG_PORT:-5173}:80"
    depends_on:
      waf:
        condition: service_started
        # 백엔드 교체로 WAF가 다시 시작되면 프런트도 내부 주소를 새로 해석합니다.
        restart: true

  dashboard-front:
    build:
      context: ./dashboard-front
      args:
        VITE_BLOG_URL: ${BLOG_FRONTEND_URL:-https://blog.example.com}
    restart: unless-stopped
    ports:
      # 개인 관리 화면은 기본적으로 서버 로컬에서만 열고, VPN·터널을 통해 접근합니다.
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-5175}:80"
    depends_on:
      waf:
        condition: service_started
        restart: true

  waf:
    image: owasp/modsecurity-crs:4.25-nginx-lts
    restart: unless-stopped
    ports:
      # WAF 진단 포트도 외부에 직접 노출하지 않습니다.
      - "127.0.0.1:${WAF_PORT:-8000}:8080"
    environment:
      BACKEND: http://backend:8000
      PORT: "8080"
      MODSEC_RULE_ENGINE: ${WAF_MODE:-On}
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit/audit.json
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      # A/H/Z만 저장해 요청 본문, 쿠키, Authorization 헤더가 감사 로그에 남지 않게 한다.
      MODSEC_AUDIT_LOG_PARTS: AHZ
      BLOCKING_PARANOIA: ${WAF_BLOCKING_PARANOIA:-1}
      DETECTION_PARANOIA: ${WAF_DETECTION_PARANOIA:-2}
      ANOMALY_INBOUND: ${WAF_INBOUND_THRESHOLD:-5}
      ANOMALY_OUTBOUND: ${WAF_OUTBOUND_THRESHOLD:-4}
    volumes:
      - waf-audit:/var/log/modsecurity
      - ./observability/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      backend:
        condition: service_healthy
        # 이미지 교체로 backend IP가 바뀌면 WAF가 이전 주소를 유지하지 않게 합니다.
        restart: true

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - backend-data:/data
      - backend-media:/app/media
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY를 설정해야 합니다}
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_SIGNUP_WEBHOOK_URL: ${DISCORD_SIGNUP_WEBHOOK_URL:-}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      WAF_DISCORD_COOLDOWN_SECONDS: ${WAF_DISCORD_COOLDOWN_SECONDS:-60}
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-blog_logs}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-admin@example.com}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD를 설정해야 합니다}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-development}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,waf}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5175,http://127.0.0.1:5175}
      DASHBOARD_LOGIN_URL: ${DASHBOARD_LOGIN_URL:-http://localhost:5175/#/login}
      DASHBOARD_FORBIDDEN_URL: ${DASHBOARD_FORBIDDEN_URL:-http://localhost:5175/#/403}
      BLOG_FRONTEND_URL: ${BLOG_FRONTEND_URL:-http://localhost:5173}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    command: >-
      sh -c "set -e;
      python manage.py migrate --noinput;
      python manage.py bootstrap_openobserve || true;
      exec gunicorn config.wsgi:application
      --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}
      --threads ${GUNICORN_THREADS:-2} --timeout ${GUNICORN_TIMEOUT:-60}
      --access-logfile - --error-logfile -"
    depends_on:
      - openobserve

  observability-agent:
    build: ./backend
    restart: unless-stopped
    command:
      [
        "python",
        "manage.py",
        "observability_agent",
        "--interval",
        "30",
        "--waf-log-path",
        "/var/log/waf/audit/audit.json",
      ]
    volumes:
      - backend-data:/data
      - waf-audit:/var/log/waf:ro
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY를 설정해야 합니다}
      DJANGO_DB_PATH: /data/db.sqlite3
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      WAF_DISCORD_COOLDOWN_SECONDS: ${WAF_DISCORD_COOLDOWN_SECONDS:-60}
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-blog_logs}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-admin@example.com}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD를 설정해야 합니다}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy
      waf:
        condition: service_started
      blog-front:
        condition: service_healthy
      dashboard-front:
        condition: service_healthy
      openobserve:
        condition: service_started

volumes:
  openobserve-data:
  waf-audit:
  backend-data:
  backend-media:

