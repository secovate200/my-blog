# 외부 TLS 프록시가 보낸 프로토콜은 보존하고, 없을 때만 현재 연결값을 사용합니다.
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# 관리자 대시보드의 정적 파일을 제공하고 인증·관리 요청은 내부 WAF로 전달합니다.
server {
    listen 80;
    server_name _;

    # WAF 컨테이너가 재생성되면 내부 IP가 바뀔 수 있으므로 Docker DNS를 주기적으로 다시 조회합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $waf_upstream http://waf:8080;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "정상\n";
    }

    # Django Admin의 정적 파일까지 같은 진입점으로 제공해야 로그인 화면이 깨지지 않습니다.
    location ~ ^/(blog|admin|static|media|i18n)/ {
        proxy_pass $waf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
