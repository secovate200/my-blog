{% load static %}

{% block content %}
    {# 모든 SmartBase 화면이 포함하는 공통 템플릿에서 문의 상태 추적기를 한 번만 로드합니다. #}
    <script src="{% static 'admin/contact-reply-status.js' %}?v=20261015-1" defer></script>
    <script>
        (function () {
            const cookieName = 'secovate-theme';
            const storageKey = 'secovate-theme';
            const maxAge = 60 * 60 * 24 * 365;
            const isTheme = (value) => value === 'light' || value === 'dark';
            const readCookie = () => document.cookie
                .split('; ')
                .find((item) => item.startsWith(cookieName + '='))
                ?.split('=')[1];
            const saveTheme = (theme) => {
                if (!isTheme(theme)) return;
                document.cookie = `${cookieName}=${theme}; Path=/; Max-Age=${maxAge}; SameSite=Lax`;
                localStorage.setItem(storageKey, theme);
                localStorage.removeItem('theme');
                localStorage.removeItem('blog-theme');
            };
            const applyTheme = (theme) => {
                if (!isTheme(theme)) return;
                const root = document.documentElement;
                // MutationObserver가 같은 값을 반복해서 기록하면 관리자 화면이 멈출 수
                // 있으므로, 실제 값이 달라질 때에만 DOM 속성을 변경합니다.
                if (root.dataset.theme !== theme) root.dataset.theme = theme;
                // SmartBase/SimpleUI의 기본 팔레트는 data-theme가 아니라 dark 클래스를
                // 기준으로 동작하므로 두 표현을 항상 함께 갱신해야 화면 일부만 밝게
                // 남는 현상을 막을 수 있습니다.
                const shouldUseDarkTheme = theme === 'dark';
                if (root.classList.contains('dark') !== shouldUseDarkTheme) {
                    root.classList.toggle('dark', shouldUseDarkTheme);
                }
                if (root.style.colorScheme !== theme) root.style.colorScheme = theme;
            };
            const applySharedTheme = () => {
                const sharedTheme = readCookie();
                if (isTheme(sharedTheme)) applyTheme(sharedTheme);
            };

            const initialTheme = readCookie()
                || localStorage.getItem(storageKey)
                || localStorage.getItem('theme')
                || localStorage.getItem('blog-theme');
            if (isTheme(initialTheme)) {
                applyTheme(initialTheme);
                saveTheme(initialTheme);
            }

            new MutationObserver((mutations) => {
                const root = document.documentElement;
                // SmartBase가 class를 바꾼 경우에는 class를, 공통 테마 코드가
                // data-theme을 바꾼 경우에는 data-theme을 원본으로 삼아 양쪽을 맞춥니다.
                const hasClassMutation = mutations.some(({attributeName}) => attributeName === 'class');
                const theme = hasClassMutation
                    ? (root.classList.contains('dark') ? 'dark' : 'light')
                    : root.dataset.theme;
                if (isTheme(theme)) {
                    applyTheme(theme);
                    saveTheme(theme);
                }
            }).observe(document.documentElement, {attributes: true, attributeFilter: ['class', 'data-theme']});

            window.addEventListener('focus', applySharedTheme);
            window.addEventListener('storage', applySharedTheme);
            document.addEventListener('visibilitychange', applySharedTheme);
            window.setInterval(applySharedTheme, 1000);
        })();
    </script>
    <style type="text/css">
        {% for weight in "123456789"|make_list %}
            @font-face {
                font-family: 'Inter';
                font-style: normal;
                font-weight: {{ forloop.counter }}00;
                font-display: swap;
                src: url("{% static 'sb_admin/fonts/Inter-Ext.woff2' %}") format('woff2');
                unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }
            @font-face {
                font-family: 'Inter';
                font-style: normal;
                font-weight: {{ forloop.counter }}00;
                font-display: swap;
                src: url("{% static 'sb_admin/fonts/Inter.woff2' %}") format('woff2');
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
        {% endfor %}
    </style>
{% endblock %}
